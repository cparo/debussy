[package]
name = "macos_platform"
description = "platform_interfaces for macOS: cpal audio devices and AudioToolbox codecs."
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
block2 = { version = "0.6.2", default-features = false, features = ["std"] }
cpal = "0.18.2"
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = [
    "std",
    "AudioConverter",
    "AudioFile",
    "AudioFormat",
    "ExtendedAudioFile",
    "objc2-core-audio-types",
    "objc2-core-foundation",
] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = [
    "std",
    "CoreAudioBaseTypes",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFBase",
    "CFURL",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSAppleEventDescriptor",
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSValue",
    "NSAppleEventManager",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSString",
    "NSURL",
] }
platform_interfaces = { path = "../platform_interfaces" }
thiserror = "2.0.21"

[dev-dependencies]
wav_files = { path = "../wav_files" }

[lints]
workspace = true
