# cargo-deny configuration: run `cargo deny check` (CI does).
# Licence policy: docs/architecture/licensing.md "Dependency licences".

[graph]
all-features = true
# Debussy ships for macOS only; dependencies of other platforms (cpal's ALSA, Windows, Android and
# web backends) are in Cargo.lock but never built, so they are not audited (ADR-0050).
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licences only. Adding a licence here, copyleft especially, is a decision for a human:
# raise it with the `flag-risk` skill and record it in an ADR.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.93
# The allowlist is policy, not a record of current dependencies.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
