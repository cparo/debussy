[package]
name = "debussy_ui"
description = "The iced user interface: transport, track list with waveforms, and the mixer."
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
audio_analysis = { path = "../audio_analysis" }
audio_buffers = { path = "../audio_buffers" }
audio_effects = { path = "../audio_effects" }
audio_engine = { path = "../audio_engine" }
engine_bridge = { path = "../engine_bridge" }
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "canvas", "image-without-codecs", "thread-pool"] }
project_model = { path = "../project_model" }
signal_graph = { path = "../signal_graph" }

[lints]
workspace = true
