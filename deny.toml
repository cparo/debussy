# cargo-deny configuration: run `cargo deny check` (CI does).
# Licence policy: docs/architecture/licensing.md "Dependency licences".

[graph]
all-features = true
# Debussy ships for macOS only; dependencies of other platforms (cpal's ALSA, Windows, Android and
# web backends) are in Cargo.lock but never built, so they are not audited (ADR-0050).
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates under iced 0.14, accepted by a human (ADR-0055). Revisit when iced drops them.
ignore = [
    # paste: a compile-time macro under wgpu's Metal backend; it runs no code in the app.
    { id = "RUSTSEC-2024-0436", reason = "compile-time only, under iced/wgpu (ADR-0055)" },
    # ttf-parser: parses system fonts for cosmic-text, never project or imported files.
    { id = "RUSTSEC-2026-0192", reason = "parses system fonts only, under iced (ADR-0055)" },
]

[licenses]
version = 2
# Permissive licences only. Adding a licence here, copyleft especially, is a decision for a human:
# raise it with the `flag-risk` skill and record it in an ADR.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # A public-domain dedication; first needed by hexf-parse, through iced's wgpu (ADR-0055).
    "CC0-1.0",
]
confidence-threshold = 0.93
# The allowlist is policy, not a record of current dependencies.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
